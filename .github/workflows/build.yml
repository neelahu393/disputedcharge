name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyxlsb openpyxl pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "扣回回補調帳產生器" `
            --hidden-import pyxlsb `
            --hidden-import openpyxl `
            --hidden-import openpyxl.utils.datetime `
            扣回回補調帳產生器.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 扣回回補調帳產生器
          path: dist/扣回回補調帳產生器.exe
          retention-days: 30
